name: 功能建议
description: 提议可复现、符合研究边界的改进
title: "[feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 本项目不接受代下单、收益承诺或弱化数据日期与证据链的功能。
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 描述使用场景，不要上传真实账户或持仓材料。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可验证的完成标准
    validations:
      required: true
